name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  TAG_PREFIX:    axe
  KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '3' }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  backend:
    name: Backend (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:   [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - { goos: linux, goarch: arm }

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          SUFFIX=""
          [ "${{ matrix.goos }}" = "windows" ] && SUFFIX=".exe"
          OUT="axe-backend-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}"
          go build \
            -ldflags "-s -w -X main.version=${{ env.TAG_PREFIX }}/${{ github.sha }}" \
            -o "$OUT" .

      - uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/axe-backend-${{ matrix.goos }}-${{ matrix.goarch }}*

  frontend-dist:
    name: Frontend dist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Package dist
        run: |
          tar czf axe-frontend-dist.tar.gz -C frontend/dist .

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: axe-frontend-dist.tar.gz

  frontend-bin:
    name: Frontend (${{ matrix.target }})
    needs: frontend-dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Extract frontend assets
        run: tar xzf frontend/dist/axe-frontend-dist.tar.gz -C frontend/dist

      - name: Compile binary
        working-directory: frontend
        run: |
          SUFFIX=""
          [[ "${{ matrix.target }}" == bun-windows-* ]] && SUFFIX=".exe"
          OUT="axe-frontend-${{ matrix.target }}${SUFFIX}"
          bun build --compile --target=${{ matrix.target }} --minify --sourcemap ./serve.js --outfile "$OUT"

      - name: Smoke test Linux binary
        if: matrix.target == 'bun-linux-x64'
        working-directory: frontend
        run: |
          PORT=4173 ./axe-frontend-bun-linux-x64 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 0.2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/notify)" = "501"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.target }}
          path: frontend/axe-frontend-${{ matrix.target }}*

  release:
    needs: [backend, frontend-bin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true

      - name: Compute tag
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${{ env.TAG_PREFIX }}/${SHA}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${{ env.TAG_PREFIX }}/${SHA}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name:               ${{ steps.meta.outputs.tag }}
          name:                   ${{ steps.meta.outputs.name }}
          target_commitish:       ${{ github.sha }}
          generate_release_notes: true
          files: "*"

      - name: Clean up old releases (keep ${{ env.KEEP_RELEASES }} most recent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: |
          # Sort by published date (newest first) so the newest releases are
          # always kept. Tags are hex SHAs, so alphabetical sorting would
          # treat the newest commit as "oldest" and delete it.
          all=$(gh release list --limit 100 --json tagName,publishedAt \
            | jq -r 'sort_by(.publishedAt) | reverse | .[].tagName')

          # Keep releases matching current prefix, delete the rest
          count=0
          for tag in $all; do
            case "$tag" in
              ${{ env.TAG_PREFIX }}/*)
                count=$((count + 1))
                [ "$count" -le "${{ env.KEEP_RELEASES }}" ] && continue
                ;;
            esac
            echo "Deleting: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
